<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link rel="stylesheet" href="estilo/style.css">
    <link rel="stylesheet" href="index.html">
</head>
<body>
    <main class="container">
        <form action="index.html">
            <h1>Bem Vindo(a) </h1>
            <div class="cadastro">  
                <input type="email" name="login" id="ilogin" placeholder="Cadastro" required>
                <span class="material-symbols-outlined">person
                </span>
            </div>
            <div class="cadastro">
                <input type="password" name="Senha" id="isenha" placeholder="Senha" required>
                <span class="material-symbols-outlined">lock</span>
            </div>
            <div class="cadastro">
                <label for="icheck">Lembrar de mim</label>
                <input type="checkbox" name="check" id="icheck">
                <a href="#">Esqueci a Senha</a>
            </div>
            <input id="botao" type="submit" value="Logar">
            <div class="account">
                Não tem uma conta? <a href="index.html">Cadastre-se</a>
            </div>
        </form>

    </main>
    
</body>
</html>
